        nav a { color: white; text-decoration: none; padding: 10px 20px; font-weight: bold; transition: 0.3s; }
        nav a:hover { color: #89b4fa; }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; background-color: white; min-width: 160px; box-shadow: 0px 8px 16px rgba(0,0,0,0.1); z-index: 10; border-radius: 4px; top: 100%; }
        .dropdown-content a { color: #333 !important; padding: 12px 16px; text-decoration: none; display: block; text-align: left; }
        .dropdown:hover .dropdown-content { display: block; }
        footer { margin-top: 50px; padding: 40px 20px; font-size: 0.9em; color: #888; border-top: 1px solid #eee; background: #fff; }
        footer a { color: #0077cc; text-decoration: none; font-weight: bold; }

        /* GAME SPECIFIC STYLES */

        #board { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; justify-content: center; margin-top: 20px; }
        .cell { width: 100px; height: 100px; background: #f0f0f0; font-size: 2.5em; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 12px; transition: 0.2s; }
        .cell:hover { background: #e8e8e8; }
        .cell.x { color: #d9534f; } 
        .cell.o { color: #5cb85c; }
        #status { margin-top: 20px; font-size: 1.1em; font-weight: bold; height: 24px; }
        #resetBtn { margin-top: 25px; padding: 12px 25px; font-size: 1em; background: #0077cc; color: white; border: none; border-radius: 8px; cursor: pointer; display: none; font-weight: bold; margin-bottom: 20px; }
        #resetBtn:hover { background: #005fa3; }

        /* --- NEW: SCOREBOARD STYLES --- */
        #scoreboard { display: flex; justify-content: space-around; margin-top: 25px; padding-top: 20px; border-top: 2px solid #eee; font-size: 1.1em; font-weight: bold; }
        .score-box { display: flex; flex-direction: column; align-items: center; }
        .score-label { font-size: 0.8em; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .score-value { font-size: 1.5em; }
        #score-wins { color: #d9534f; } /* Red for Player X */
        #score-losses { color: #5cb85c; } /* Green for AI O */
        #score-draws { color: #333; }
    </style>

<body>

    <nav>
        <a href="index.html">Home</a>
        <div class="dropdown">
            <a href="#">Projects ▾</a>
            <div class="dropdown-content">
                <a href="tictactoe.html">Tic-Tac-Toe AI</a>
            </div>
        </div>
        <a href="mailto:sankur@ualberta.ca">Contact</a>

    <h1>Tic-Tac-Toe (Q-Learning Algorithm)</h1>
    <p>Can you beat an agent trained on 100,000 games?</p>

    <div id="game-container">
        <div id="status">Loading AI Brain...</div>
        <div id="board"></div>
        <button id="resetBtn" onclick="resetGame()">Play Again</button>

        <div id="scoreboard">
            <div class="score-box">
                <span class="score-label">You</span>
                <span class="score-value" id="score-wins">0</span>
            </div>
            <div class="score-box">
                <span class="score-label">Draws</span>
                <span class="score-value" id="score-draws">0</span>
            </div>
            <div class="score-box">
                <span class="score-label">AI</span>
                <span class="score-value" id="score-losses">0</span>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Suryansh Ankur | <a href="https://www.linkedin.com/in/suryansh-ankur" target="_blank">LinkedIn Profile</a></p>
    </footer>

    <script>
        let qTable = {};
        let board = [1, 2, 3, 4, 5, 6, 7, 8, 9];
        let gameActive = false;

        // --- NEW: SCORE TRACKING VARIABLES ---
        let playerWins = 0;
        let aiWins = 0;
        let draws = 0;

        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], 
            [0, 3, 6], [1, 4, 7], [2, 5, 8], 
            [0, 4, 8], [2, 4, 6]             
        ];

        fetch('agent_brain.json')
            .then(response => response.json())
            .then(data => {
                qTable = data;
                document.getElementById('status').innerText = "AI is ready. You are X. Your turn!";
                gameActive = true;
                drawBoard();
            })
            .catch(error => {
                document.getElementById('status').innerText = "Error loading AI brain! Are you using a local server?";
            });

        function drawBoard() {
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = '';
            board.forEach((cell, index) => {
                const div = document.createElement('div');
                div.className = 'cell';
                
                if (cell === 99) {
                    div.innerText = 'X';
                    div.classList.add('x');
                } else if (cell === 88) {
                    div.innerText = 'O';
                    div.classList.add('o');
                } else {
                    div.innerText = '';
                }
                
                div.onclick = () => humanMove(index);
                boardDiv.appendChild(div);
            });
        }

        function checkWin(player) {
            return winPatterns.some(pattern => {
                return pattern.every(index => board[index] === player);
            });
        }

        function checkDraw() {
            return board.every(cell => cell === 99 || cell === 88);
        }

        // --- UPDATED: ENDGAME NOW ACCEPTS A RESULT TO UPDATE SCORE ---
        function endGame(message, result) {
            gameActive = false;
            document.getElementById('status').innerText = message;
            document.getElementById('resetBtn').style.display = 'inline-block';

            // Update variables based on who won
            if (result === 'win') {
                playerWins++;
                document.getElementById('score-wins').innerText = playerWins;
            } else if (result === 'loss') {
                aiWins++;
                document.getElementById('score-losses').innerText = aiWins;
            } else if (result === 'draw') {
                draws++;
                document.getElementById('score-draws').innerText = draws;
            }
        }

        function resetGame() {
            board = [1, 2, 3, 4, 5, 6, 7, 8, 9];
            gameActive = true;
            document.getElementById('status').innerText = "You are X. Your turn";
            document.getElementById('resetBtn').style.display = 'none';
            drawBoard();
        }

        function humanMove(index) {
            if (!gameActive || board[index] === 99 || board[index] === 88) return;
            
            board[index] = 99; 
            drawBoard();
            
            // --- UPDATED: PASS THE RESULT STRING TO ENDGAME ---
            if (checkWin(99)) {
                endGame("🎉 YOU WIN! (Wait, how did you beat my perfect AI?)", 'win');
                return;
            }
            if (checkDraw()) {
                endGame("🤝 It's a Draw!", 'draw');
                return;
            }
            
            document.getElementById('status').innerText = "AI is thinking...";
            gameActive = false; 
            setTimeout(aiMove, 400); 
        }

        function aiMove() {
            let stateKey = "(" + board.join(", ") + ")";
            let qValues = qTable[stateKey];

            let bestMoveIndex = -1;
            let maxQ = -Infinity;

            for (let i = 0; i < 9; i++) {
                if (board[i] !== 88 && board[i] !== 99) { 
                    let score = qValues ? qValues[i] : 0; 
                    if (score > maxQ) {
                        maxQ = score;
                        bestMoveIndex = i;
                    }
                }
            }

            if (bestMoveIndex !== -1) {
               board[bestMoveIndex] = 88; 
            }
            
            drawBoard();

            // --- UPDATED: PASS THE RESULT STRING TO ENDGAME ---
            if (checkWin(88)) {
                endGame("🤖 AI WINS! Good Game try again ?", 'loss');
                return;
            }
            if (checkDraw()) {
                endGame("🤝 It's a Draw!", 'draw');
                return;
            }

            document.getElementById('status').innerText = "Your turn!";
            gameActive = true; 
        }
    </script>
</body>
</html>
